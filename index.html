<center>
    <h1>Find Your Perfect Apartment</h1>
<p>Book a comfortable, stylish, and luxurious apartment that feels like home.</p>
</center>
<form action="form.php" method="post">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required><br><br>

    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone" required><br><br>

    <label for="CNIC Number">CNIC Number:</label>
    <input type="tel" id="CNIC" name="CNIC" required><br><br>

    <label for="Your Exact Address">Your Exact Address:</label>
    <input type="text" id="address" name="address" required><br><br>

    <label for="apartment">Select Apartment Type:</label>
    <select id="apartment" name="apartment">
        <option value="studio">Studio</option>
        <option value="1bedroom">1 Bedroom</option>
        <option value="2bedroom">2 Bedroom</option>
        <option value="penthouse">Penthouse</option>
    </select><br><br>


    <label for="checkin">Check-in Date:</label>
    <input type="date" id="checkin" name="checkin" required><br><br>

    <label for="checkout">Check-out Date:</label>
    <input type="date" id="checkout" name="checkout" required><br><br>

    <input type="submit" value="Book Now">
    <br><br>
    <a href="luxury.html">Luxury Apartment</a>


  
</body>
